<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>결제 실패 | Clipora AI 숏폼</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header"><div class="container"><a href="index.html" class="logo"><span class="logo-mark">▶</span>Clipora</a></div></header>
  <main class="container auth-wrap">
    <div class="auth-card" style="text-align: center;">
      <div style="font-size: 44px;">⚠️</div>
      <h1>결제가 취소되었어요</h1>
      <p id="msg">결제가 진행되지 않았어요.</p>
      <a href="pricing.html" class="btn btn-primary btn-block">요금제로 돌아가기</a>
    </div>
  </main>
  <script>
    const m = new URLSearchParams(location.search).get('message');
    if (m) document.getElementById('msg').textContent = m;
  </script>
</body>
</html>
