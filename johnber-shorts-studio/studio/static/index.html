<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101318">
  <title>존버나드 쇼츠 스튜디오</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app" aria-live="off"></div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <input id="video-upload" type="file" accept="video/*,.mkv,.mov,.mp4" hidden>
  <input id="subtitle-upload" type="file" accept=".srt,.vtt" hidden>
  <input id="project-import" type="file" accept=".json" hidden>
  <input id="template-import" type="file" accept=".json" hidden>
  <input id="logo-upload" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <input id="background-upload" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <script src="/static/app.js" defer></script>
</body>
</html>
